services:
  client:
    build:
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host

  server:
    build:
      target: development
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev